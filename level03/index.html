<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="土城國小英文700單字 第3關（No. 46–66 身體部位與狀態）Q版3D英語聽力闖關遊戲">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<title>健康小隊長 Health Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap">
<style>
/* Layout: one-screen game. Header strip · walkable schoolyard canvas · mission panel docked at the bottom.
   Single bright "sunny schoolyard" theme by choice (a kids' game world), every color set explicitly. */
:root{
  --ink:#22324a; --ink-soft:#5a6b82; --paper:#ffffff; --ground:#dfe9ec;
  --sun:#ffc83d; --sun-deep:#e9a400;
  --cross:#e24f4f; --mint:#2fb39a; --mint-bg:#dcf5ee; --oops:#e0614f; --oops-bg:#fde7e3;
  --sky:#3d8fd6; --line:#c9d6dd;
  --font-en:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-zh:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--font-zh);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.en{font-family:var(--font-en)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1200px;margin:0 auto}

/* header */
.hud{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.cap{width:40px;height:40px;flex:none}
.badge h1{margin:0;font-family:var(--font-en);font-weight:700;font-size:20px;line-height:1.05;white-space:nowrap}
.badge small{display:block;font-family:var(--font-zh);font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge>div{min-width:0}
.chipbtn{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;box-shadow:0 3px 0 var(--ink);min-height:40px}
.chipbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.count{display:inline-flex;align-items:center;gap:6px;background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--font-en);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-height:40px}
.count svg{width:20px;height:20px}
.prog{background:var(--paper)}

/* stage */
.stage{position:relative;min-height:0;margin-inline:16px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:#cfe0c8}
canvas#map,canvas.gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage{touch-action:none;background:#bfe3f5}
#ptr{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(34,50,74,.35))}
#ptr svg{width:100%;height:100%}

/* mission panel */
.panel{margin:10px 16px 12px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:8px;min-height:96px}
.task{display:flex;gap:10px;align-items:center}
.task .face{width:46px;height:46px;flex:none;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--sun);font-size:24px}
.task p{margin:0;min-width:0}
.task b{font-size:18px}
.task .sub{display:block;color:var(--ink-soft);font-size:14px}
.line{font-family:var(--font-en);font-weight:700;font-size:24px;line-height:1.15}
.line.zh{font-family:var(--font-zh);font-weight:400;font-size:18px;color:var(--ink-soft)}
.ears{font-size:18px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px;min-height:46px;font-size:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.act.main{background:var(--cross);color:#fff}
.act.go{background:var(--mint);color:#fff}
.act.sun{background:var(--sun)}
.act svg{width:20px;height:20px;flex:none}
.act[disabled]{opacity:.45;cursor:default}
.toast{border-radius:12px;padding:8px 12px;font-size:16px}
.toast.no{background:var(--oops-bg);color:#a8322a}
.toast.ok{background:var(--mint-bg);color:#17735f}
.keys{font-size:13px;color:var(--ink-soft)}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(34,50,74,.45);overflow:auto}
.ov[hidden]{display:none!important}
.card{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--font-en);font-size:30px;line-height:1.1;text-wrap:balance}
.card h2 .zh{display:block;font-family:var(--font-zh);font-weight:400;font-size:19px;color:var(--ink-soft);margin-top:4px}
.card p{margin:0}
.tiny{font-size:14px;color:var(--ink-soft)}

/* title */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero svg{width:120px;height:auto}
.lvtag{display:inline-block;font-family:var(--font-en);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--cross);color:#fff;border-radius:8px;padding:2px 8px}
.title-en{font-family:var(--font-en);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:.95;margin:6px 0 2px;color:var(--ink)}
.title-zh{font-size:22px;margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{border:2.5px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px}
.step .n{font-family:var(--font-en);font-weight:700;color:var(--cross);font-size:14px;letter-spacing:.08em}
.step b{font-size:16px}
.step span{font-size:13px;color:var(--ink-soft);line-height:1.35}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lab{font-size:15px;margin-right:4px}
.seg button{border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;min-height:40px;background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bigbtns{display:flex;gap:10px;flex-wrap:wrap}
.bigbtns .act{font-size:19px;padding:10px 20px;min-height:54px}

/* success */
.win{text-align:center;align-items:center}
.win .item{font-size:64px;line-height:1}
.win .stars3{display:flex;gap:6px;justify-content:center}
.win .stars3 svg{width:46px;height:46px}
.say{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:4px 8px;text-align:left}
.say:hover{background:var(--ground)}
.say svg{width:24px;height:24px;flex:none;color:var(--cross)}
.why{background:var(--mint-bg);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.why b{color:#17735f}

/* body tap */
.bodies{display:flex;gap:12px;align-items:flex-end;justify-content:center}
.bodies figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bodies figcaption{font-size:13px;color:var(--ink-soft)}
.front{width:min(260px,58vw)}
.backv{width:min(140px,30vw)}
.zone{fill:transparent;cursor:pointer;pointer-events:all}
.zone:hover{fill:rgba(255,200,61,.28)}
.zone.hit{fill:rgba(47,179,154,.4)}
.zone.miss{fill:rgba(224,97,79,.35)}
.bodylabel{font-family:var(--font-en);font-weight:700;font-size:22px;min-height:30px;text-align:center}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:4px 10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.row .no{font-family:var(--font-en);font-weight:700;color:var(--cross);font-variant-numeric:tabular-nums}
.row .txt{min-width:0}
.row .txt .e{font-family:var(--font-en);font-weight:600;font-size:19px;line-height:1.2}
.row .txt .z{font-size:14px;color:var(--ink-soft)}
.row .btns{display:flex;gap:6px}
.mini{border:2px solid var(--ink);border-radius:10px;min-width:44px;min-height:40px;padding:0 8px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--paper)}
.mini svg{width:18px;height:18px;color:var(--cross)}
.ms{font-size:13px;color:var(--sun-deep);letter-spacing:1px}
.ms .off{color:var(--line)}
.par h3{margin:6px 0 2px;font-size:18px}
.par ul{margin:0;padding-left:20px}
.par li{margin:2px 0}
.close{align-self:flex-end}

@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .45s ease both}
.shake{animation:shake .35s ease}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}}

@media (max-width:620px){
  .steps{gap:6px}
  .step{padding:8px}
  .step span{display:none}
  .hero{gap:10px}
  .hero svg{width:64px}
  .title-zh{font-size:18px}
  .bigbtns .act{font-size:17px;padding:8px 14px;min-height:48px}
  .panel .act{padding:6px 10px;font-size:15px;min-height:44px}
  .line{font-size:21px}
  .badge h1{font-size:17px}
  .hud{gap:6px;padding-block:6px}
  .chipbtn{padding:4px 10px;font-size:14px}
  .count{font-size:16px;padding:3px 10px}
  .panel{margin-block:8px 10px}
  .card{padding:16px}
}
</style>

/* ---------- audio ---------- */
const cache={}; let curAudio=null, seqTok=0;
function clip(k){ if(!AUD[k]) return null; if(!cache[k]){ cache[k]=new Audio(AUD[k]); cache[k].preload="auto"; } return cache[k]; }
function stopAudio(){ seqTok++; if(curAudio){ try{curAudio.pause();}catch(e){} } }
function playOne(k,rate,tok){
  return new Promise(res=>{
    const a=clip(k); if(!a||tok!==seqTok){res();return;}
    if(curAudio&&curAudio!==a){try{curAudio.pause();}catch(e){}}
    curAudio=a; a.pause(); a.currentTime=0; a.playbackRate=rate||1;
    try{a.preservesPitch=true;a.webkitPreservesPitch=true;}catch(e){}
    let done=false; const fin=()=>{if(done)return;done=true;clearTimeout(t);res();};
    const t=setTimeout(fin,9000);
    a.onended=fin; a.onerror=fin;
    const p=a.play(); if(p&&p.catch) p.catch(fin);
  });
}
async function play(keys,rate){ stopAudio(); const tok=seqTok; for(const k of [].concat(keys)){ if(tok!==seqTok) return false; await playOne(k,rate,tok); await wait(120); } return tok===seqTok; }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let ac=null;
function tone(fs,type="triangle",step=.09,len=.2,vol=.16){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t0=ac.currentTime;
    fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+i*step);g.gain.linearRampToValueAtTime(vol,t0+i*step+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+i*step+len);o.connect(g).connect(ac.destination);o.start(t0+i*step);o.stop(t0+i*step+len+.05);});
  }catch(e){}
}

function buildQueue(){
  const pool=DATA.filter(d=>d.st);
  const nurse=pool.filter(d=>d.st==="nurse"), other=pool.filter(d=>d.st!=="nurse");
  const rank=list=>shuffle(list).sort((a,b)=>(saved.best[a.id]??-1)-(saved.best[b.id]??-1));
  return shuffle(rank(nurse).slice(0,4).concat(rank(other).slice(0,6)));
}
function spawn(){
  const d=G.queue[G.idx]; let x,y,tries=0;
  do{ x=240+Math.random()*620; y=230+Math.random()*280; tries++; }
  while(tries<40 && Math.hypot(x-G.player.x,y-G.player.y)<230);
  const c=COLORS[G.idx%COLORS.length];

/* ---------- update ---------- */
const SPEED=230;
function update(dt){
  const P=G.player; let vx=0,vy=0;
  if(G.mode==="seek"||G.mode==="escort"){
    if(G.keys.u)vy-=1; if(G.keys.d)vy+=1; if(G.keys.l)vx-=1; if(G.keys.r)vx+=1;
    if(!vx&&!vy&&G.target){ const dx=G.target.x-P.x, dy=G.target.y-P.y, dd=Math.hypot(dx,dy); if(dd>6){vx=dx/dd;vy=dy/dd;} else if(!pDown) G.target=null; }
  }
  const m=Math.hypot(vx,vy); P.moving=m>0;
  if(m){ vx/=m; vy/=m; P.x=Math.max(24,Math.min(W-24,P.x+vx*SPEED*dt)); P.y=Math.max(30,Math.min(H-16,P.y+vy*SPEED*dt)); if(vx) P.dir=vx>0?1:-1; P.phase+=dt*10;
    G.hist.push({x:P.x,y:P.y}); if(G.hist.length>200) G.hist.shift(); }
  const pt=G.patient;
  if(pt){ pt.phase+=dt;
    if(G.mode==="seek" && Math.hypot(P.x-pt.x,P.y-pt.y)<64) startListen();
    if(pt.state==="follow"){ const h=G.hist[Math.max(0,G.hist.length-16)]; if(h){ const dx=h.x-pt.x, dy=h.y-pt.y, dd=Math.hypot(dx,dy); if(dd>2){ const sp=Math.min(dd, SPEED*1.1*dt); pt.x+=dx/dd*sp; pt.y+=dy/dd*sp; pt.moving=true; pt.dir=dx>0?1:-1; pt.walk=(pt.walk||0)+dt*10;} else pt.moving=false; } }
    if(G.mode==="escort"){
      const s=STATIONS.find(s=>P.x>s.x-6&&P.x<s.x+s.w+6&&P.y>s.y-6&&P.y<s.y+s.h+30);
      if(s&&s.id!==G.lastSt){ G.lastSt=s.id; onStation(s); } else if(!s) G.lastSt=null;
    }
  }
  // camera
  const vw=view.w/view.s, vh=view.h/view.s;
  view.cx = W<=vw ? -(vw-W)/2 : Math.max(0,Math.min(W-vw,P.x-vw/2));
  view.cy = H<=vh ? -(vh-H)/2 : Math.max(0,Math.min(H-vh,P.y-vh/2));
}

function draw(){

  if(pt) ents.push({y:pt.y,f:()=>{ drawKid(pt.x,pt.y,{shirt:pt.shirt,hair:pt.hair,girl:pt.girl,moving:pt.moving,phase:pt.walk||0,dir:pt.dir||1,mood:pt.state==="happy"?"happy":"sad"});
    if(pt.state==="wait") bubble(pt.x,pt.y,"!","#ffc83d"); else if(pt.state==="talk") bubble(pt.x,pt.y,"♪","#ffffff"); }});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  // pointer to patient when off-screen
  if(pt&&pt.state==="wait"){
    const sx=(pt.x-view.cx)*s, sy=(pt.y-40-view.cy)*s;
    if(sx<0||sy<0||sx>view.w||sy>view.h){
      const cx=Math.max(30,Math.min(view.w-30,sx)), cy=Math.max(30,Math.min(view.h-30,sy)), a=Math.atan2(sy-view.h/2,sx-view.w/2);
      ctx.setTransform(d,0,0,d,0,0); ctx.translate(cx,cy); ctx.rotate(a);
      ctx.fillStyle="#ffc83d"; ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-10,-14); ctx.lineTo(-4,0); ctx.lineTo(-10,14); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
}
let last=performance.now();
function loop(t){ const dt=Math.min(.1,(t-last)/1000); last=t; update(dt);
  if(R3){ try{ R3.render(dt); }catch(e){ R3=null; document.querySelectorAll("canvas.gl").forEach(c=>c.remove()); cv.style.display=""; $("#ptr").hidden=true; } }
  else draw();
  requestAnimationFrame(loop); }
requestAnimationFrame(loop);
goTitle();
</script>
